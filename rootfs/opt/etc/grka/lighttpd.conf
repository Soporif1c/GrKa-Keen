# GrKa Keen - конфигурация веб-сервера панели (отдельный экземпляр lighttpd)
# Порт панели можно изменить здесь (после изменения: /opt/etc/init.d/S99grka-keen restart)

server.port         = 1100
server.document-root = "/opt/share/grka/www"
server.upload-dirs  = ( "/opt/tmp" )
server.errorlog     = "/opt/var/log/grka/lighttpd.log"
server.pid-file     = "/opt/var/run/grka-lighttpd.pid"
server.modules      = ( "mod_cgi" )

index-file.names    = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".js"   => "application/javascript; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".json" => "application/json; charset=utf-8",
  ".png"  => "image/png",
  ".svg"  => "image/svg+xml",
  ".ico"  => "image/x-icon"
)

$HTTP["url"] =~ "^/cgi-bin/" {
  cgi.assign = ( "" => "" )
}
