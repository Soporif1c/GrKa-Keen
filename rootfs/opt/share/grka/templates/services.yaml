# title: Сервисы и селекторы (YouTube, Discord, Telegram, AI и др.)
#######################################################################################################
# ВАЖНО: перед сохранением добавьте хотя бы один прокси («Добавить прокси из ссылки») —
# группы подхватят его автоматически (include-all: true).
#
# По умолчанию ВЕСЬ трафик идёт напрямую. Всё настраивается на вкладке «Селекторы»:
#   - «Весь трафик»    — главный переключатель: весь трафик напрямую (DIRECT) или через прокси
#   - «Заблок. сервисы» — выберите здесь прокси, чтобы заблокированные ресурсы открывались через него
#   - группы сервисов (YouTube, Discord, Twitch и т.д.) — у каждой свой выбор: напрямую (DIRECT),
#     через «Заблок. сервисы» или через конкретный прокси; они имеют приоритет над остальными правилами
#
# Пример «только YouTube и Twitch через прокси, остальное напрямую»:
#   Весь трафик = DIRECT, Заблок. сервисы = DIRECT, YouTube = <прокси>, Twitch = <прокси>
#
# Основано на шаблоне zxc-rv/XKeen-UI, адаптировано под Keenetic (TUN только для политики «GrKa»).
#######################################################################################################

log-level: info
allow-lan: true
mode: rule
find-process-mode: off
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
external-ui: ui
secret: ''
profile: { store-selected: true, store-fake-ip: true }
sniffer: { enable: true, sniff: { HTTP: { ports: [80, 8080] }, TLS: { ports: [443, 8443] } }, skip-dst-address: [rule-set:telegram@ipcidr] }

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*.lan', '+.local', '+.keenetic.io']
  nameserver: [8.8.8.8, 1.1.1.1]
  # Если провайдер перехватывает обычный DNS — используйте DoH:
  # nameserver: [https://dns.google/dns-query, https://cloudflare-dns.com/dns-query]
  proxy-server-nameserver: [8.8.8.8, 1.1.1.1]

# Keenetic: auto-route выключен — в TUN заворачиваются только клиенты политики
# «GrKa» (маршрутизацией управляет GrKa Keen). Имя устройства grka-tun не меняйте.
tun:
  enable: true
  stack: system
  device: grka-tun
  auto-route: false
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack: ['any:53']

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400 }
  a4: &inline { type: inline, behavior: classical }

# Прокси добавляются кнопкой «Добавить прокси из ссылки»
proxies: []

proxy-groups:
  - name: Весь трафик
    type: select
    icon: https://www.svgrepo.com/show/396567/globe-with-meridians.svg
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: Заблок. сервисы
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Reject.png
    include-all: true
    proxies: [DIRECT]

  - name: YouTube
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Discord
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Twitch
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: Reddit
    type: select
    icon: https://www.redditstatic.com/shreddit/assets/favicon/192x192.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: Meta
    type: select
    icon: https://github.com/zxc-rv/assets/raw/main/group-icons/meta.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Spotify
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
    include-all: true
    exclude-filter: 🇷🇺
    proxies: [Заблок. сервисы, DIRECT]

  - name: Speedtest
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Telegram
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Steam
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: CDN
    type: select
    icon: https://www.svgrepo.com/show/396567/globe-with-meridians.svg
    include-all: true
    proxies: [Заблок. сервисы, PASS]

  - name: Google
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    include-all: true
